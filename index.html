<label>Compulinics name<input data-n=c value="${e(s.nm.c)}"></label><label>Travels name<input data-n=t value="${e(s.nm.t)}"></label>${Object.keys(s.br).map(b=>`<label>${b} address<input data-b="${b}" value="${e(s.br[b])}"></label>`).join('')}</div>
<label>Invoice terms (one per line)<textarea data-s=ti rows=4>${e(s.ti)}</textarea></label><label>Quotation terms (one per line)<textarea data-s=tq rows=5>${e(s.tq)}</textarea></label>
<label>Stamp / signature image<input type=file accept="image/*" id=st></label>${s.stamp?`<img src="${s.stamp}" height=50>`:''}</div>
<div class=card><button data-a=bk>Download backup</button><label style="margin-top:8px">Restore backup file<input type=file accept=".json" id=rs></label></div>`}
async function csv(){const t='\ufeff'+[RB.H,...RB.B].map(r=>r.map(v=>`"${String(typeof v=='number'?R(v):v??'').replace(/"/g,'""')}"`).join(',')).join('\n'),dl=window.claude&&await claude.use('downloads');
dl?dl.save({filename:`krithvi-${RK}-${RF.f}-to-${RF.t}.csv`,data:t}).catch(()=>0):toast('Download not available here')}
async function bk(){const dl=window.claude&&await claude.use('downloads');dl?dl.save({filename:'krithvi-backup-'+td()+'.json',data:JSON.stringify(D)}).catch(()=>0):toast('Download not available here')}
function stamp(f){const r=new FileReader;r.onload=()=>{const i=new Image;i.onload=()=>{const k=Math.min(1,260/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);D.s.stamp=c.toDataURL('image/png');cfg();sets()};i.src=r.result};r.readAsDataURL(f)}
document.addEventListener('click',ev=>{const t=ev.target.closest('button');if(!t)return;const a=t.dataset.a,g=t.dataset.go,id=t.dataset.id,x=D.docs.find(z=>z.id==id);
if(g){E=g=='ni'?nd('i'):g=='nq'?nd('q'):null;go(g=='ni'||g=='nq'?'new':g)}else if(t.dataset.rk){RK=t.dataset.rk;reps()}
else if(a=='add'){E.lines.push(L('','','',1,0));form()}else if(t.dataset.del){E.lines.splice(+t.dataset.del,1);E.lines.length||E.lines.push(L('','','',1,0));form()}
else if(a=='save')save();else if(a=='pe')pr(E);else if(a=='cx'){E=null;go('docs')}else if(a=='edit'){E=structuredClone(x);go('new')}else if(a=='print')pr(x);
else if(a=='conv'){E=structuredClone(x);Object.assign(E,{type:'i',id:nid(),no:nxt('i'),date:td(),st:'UNPAID',mode:'UPI / Cash',isNew:1});go('new')}
else if(a=='rm'){if(t.dataset.s!='1'){t.dataset.s=1;t.textContent='Sure?';return}api('DELETE','/api/bills/'+id).then(()=>{D.docs=D.docs.filter(z=>z.id!=id);list()}).catch(()=>toast('Only the owner can delete'))}
else if(a=='csv')csv();else if(a=='bk')bk();else if(a=='lg')api('POST',LG?'/api/setup':'/api/login',{u:$('#lu').value,p:$('#lp').value}).then(load).catch(x=>toast(x.message||'Sign in failed'));else if(a=='lo')api('POST','/api/logout').finally(()=>location.reload());else if(a=='ua')api('POST','/api/users',{u:$('#nu').value,p:$('#np').value,role:$('#nr').value}).then(usr).catch(x=>toast(x.message));else if(a=='ud')api('DELETE','/api/users/'+id).then(usr)});
document.addEventListener('input',ev=>{const t=ev.target,k=t.dataset;if(V!='new'||!E)return;if(k.k)E[k.k]=t.type=='checkbox'?+t.checked:t.value;else if(k.l)E.lines[k.i][k.l]=['qty','rate','gst'].includes(k.l)?parseFloat(t.value)||0:t.value;else return;$('#pv').innerHTML=sheet(E)});
document.addEventListener('change',ev=>{const t=ev.target,k=t.dataset;
if(k.s){D.s[k.s]=(k.s=='ni'||k.s=='nq')?+t.value||1:t.value;cfg()}else if(k.n){D.s.nm[k.n]=t.value;cfg()}else if(k.b){D.s.br[k.b]=t.value;cfg()}else if(k.r){RF[k.r]=t.value;reps()}
else if(t.id=='fq'){FQ=t.value;list()}else if(t.id=='ft'){FT=t.value;list()}else if(t.id=='st'&&t.files[0])stamp(t.files[0])
else if(t.id=='rs'&&t.files[0])t.files[0].text().then(x=>{try{D=JSON.parse(x);keep();cfg();D.docs.forEach(putDoc);toast('Backup restored');go('docs')}catch{toast('Invalid backup file')}})
else if(V=='new'&&E){if(k.k=='cn'){const c=D.cust.find(c=>c.cn==t.value);if(c){Object.assign(E,c);form()}}if(k.l=='desc'){const m=D.items.find(x=>x.desc==t.value);if(m){Object.assign(E.lines[k.i],m);form()}}}});
let ME=null,LG=0;
window.claude={use:async()=>({save:async o=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o.data]));a.download=o.filename;a.click()}})};
async function load(){const x=await api('GET','/api/all');ME=x.me;if(x.cfg){D.s=x.cfg.s;D.cust=x.cfg.cust||[];D.items=x.cfg.items||[]}else cfg();D.docs=x.bills;go('docs')}
function login(setup){LG=setup;ME=null;$('#nv').innerHTML='';$('#v').innerHTML=`<div class=card style="max-width:360px;margin:40px auto"><h3>${setup?'Create owner account':'Sign in to Krithvi Billing'}</h3><label>Username<input id=lu autocomplete=username></label><label>Password<input id=lp type=password autocomplete=current-password></label><p><button class=p data-a=lg>${setup?'Create account':'Sign in'}</button></p></div>`}
async function usr(){const l=await api('GET','/api/users');$('#v').innerHTML=`<div class=card><h3>Logins</h3><table>${l.map(x=>`<tr><td>${e(x.u)}<td>${x.role}<td>${x.role=='owner'?'':`<button data-a=ud data-id=${x.id}>Remove</button>`}`).join('')}</table></div><div class=card><h3>Add a login</h3><div class=g><label>Username<input id=nu></label><label>Password (8+ characters)<input id=np type=password></label><label>Role<select id=nr><option value=staff>Staff (billing only)<option value=owner>Owner (full access)</select></label></div><button class=p data-a=ua>Add login</button></div>`}
setInterval(()=>{if(ME&&(V=='docs'||V=='rep'))api('GET','/api/all').then(x=>{D.docs=x.bills;ui()}).catch(()=>0)},30000);
fetch('/api/state').then(x=>x.json()).then(x=>x.setup?login(1):load()).catch(()=>login());
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
